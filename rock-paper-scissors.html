<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors · Game Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5A3A4A;
    --ink-soft:#B899A8;
    --paper:#FFFDF8;
    --white:#ffffff;
    --hotpink:#FFA0D2;
    --mint:#C4F7EF;
    --yellow:#FFF7B8;
    --peach:#FFD4CE;
    --ivory:#FFFEF5;
    --good:#8FCB4E;
    --bad:#F4867C;
    --shadow: 0 10px 0 rgba(255,160,210,0.2);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,160,210,0.2) 1px, transparent 0) 0 0/26px 26px,
      var(--paper);
    font-family:'Nunito', sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  a{ text-decoration:none; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 6vw 0; }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Press Start 2P', monospace; font-size:12px; color:var(--ink); }
  .brand-dot{ width:14px;height:14px;background:var(--hotpink); border:2px solid var(--ink); box-shadow:3px 3px 0 rgba(58,42,51,0.25); }
  .back{ font-family:'Press Start 2P', monospace; font-size:9px; background:var(--white); border:2px solid var(--ink); border-radius:999px; padding:8px 14px; color:var(--ink); box-shadow:2px 2px 0 rgba(58,42,51,0.18); }
  .sound-toggle{ font-family:'Press Start 2P', monospace; font-size:9px; background:var(--mint); border:2px solid var(--ink); border-radius:999px; padding:8px 14px; color:var(--ink); box-shadow:2px 2px 0 rgba(58,42,51,0.18); cursor:pointer; }
  .topright{ display:flex; gap:10px; }

  .hero{ padding:26px 6vw 6px; text-align:center; }
  .hero-tag{ display:inline-block; font-family:'Press Start 2P', monospace; font-size:9px; background:var(--yellow); border:2px solid var(--ink); padding:6px 12px; border-radius:8px; margin-bottom:12px; box-shadow:3px 3px 0 rgba(58,42,51,0.2); }
  .hero h1{ font-family:'Fredoka', sans-serif; font-weight:700; font-size:clamp(30px, 6vw, 46px); margin:0; }
  .hero h1 span{ color:var(--hotpink); -webkit-text-stroke:1.2px var(--ink); text-shadow:3px 3px 0 var(--yellow); }

  .arena{ max-width:640px; margin: 22px auto 60px; padding:0 6vw; }

  /* Difficulty picker now lives ABOVE the game stage, as its own card */
  .diffCard{
    background:var(--white); border:3px solid var(--ink); border-radius:20px;
    box-shadow:var(--shadow); padding:24px 26px; text-align:center; margin-bottom:20px;
  }
  .diffCard p{ color:var(--ink-soft); margin:0 0 18px; }
  .diffRow{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .diffBtn{
    font-family:'Press Start 2P', monospace; font-size:10px; color:var(--ink);
    background:var(--ivory); border:2.5px solid var(--ink); border-radius:12px;
    padding:14px 18px; cursor:pointer; box-shadow:3px 3px 0 rgba(58,42,51,0.2);
    transition:transform .12s ease;
  }
  .diffBtn:hover{ transform:translateY(-3px); }
  .diffBtn small{ display:block; font-family:'Nunito',sans-serif; font-weight:700; font-size:10px; color:var(--ink-soft); margin-top:6px; }
  .diffBtn.easy{ background:var(--mint); }
  .diffBtn.medium{ background:var(--yellow); }
  .diffBtn.hard{ background:var(--hotpink); }
  .cur-diff{ font-family:'Press Start 2P', monospace; font-size:8px; color:var(--ink-soft); text-align:center; margin-top:6px; margin-bottom:14px; }

  .stage-card{ background:var(--white); border:3px solid var(--ink); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
  .awning{ height:30px; background: repeating-linear-gradient(90deg, var(--hotpink) 0 18px, var(--peach) 18px 36px); border-bottom:3px solid var(--ink); }
  .stage{ display:flex; align-items:flex-end; justify-content:center; gap:24px; background:var(--mint); padding:18px 10px 10px; position:relative; }
  .vs{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--ink); background:var(--white); border:2px solid var(--ink); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }

  .scoreboard{ display:flex; justify-content:space-between; align-items:center; padding:10px 22px 0; font-family:'Press Start 2P', monospace; font-size:11px; }
  .score-you{ color:#C2467A; } .score-cpu{ color:#B87A2D; }
  .best-of{ text-align:center; font-family:'Press Start 2P', monospace; font-size:8px; color:var(--ink-soft); margin-top:6px; padding-bottom:6px; }

  .char{ width:56px; height:64px; position:relative; filter:drop-shadow(2px 3px 0 rgba(58,42,51,0.25)); transition:transform .18s; }
  .char .head{ position:absolute; left:50%; top:14px; transform:translateX(-50%); width:44px; height:40px; background:var(--fur,#E8C79A); border:2.5px solid var(--ink); border-radius:14px; }
  .char .ear{ position:absolute; top:2px; width:16px; height:20px; background:var(--fur,#E8C79A); border:2.5px solid var(--ink); }
  .char .ear.l{ left:2px; border-radius:60% 40% 0 40%; } .char .ear.r{ right:2px; border-radius:40% 60% 40% 0; }
  .char .eye{ position:absolute; top:32px; width:5px; height:6px; background:var(--ink); border-radius:1px; }
  .char .eye.l{ left:16px; } .char .eye.r{ right:16px; }
  .char .blush{ position:absolute; top:40px; width:7px; height:4px; background:var(--hotpink); border-radius:50%; opacity:.8; }
  .char .blush.l{ left:10px; } .char .blush.r{ right:10px; }
  .char .muzzle{ position:absolute; left:50%; top:38px; transform:translateX(-50%); width:14px; height:9px; background:var(--fur-in,#F6E3C6); border-radius:0 0 8px 8px; border:2px solid var(--ink); border-top:none; }
  .char .body{ position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:34px; height:20px; background:var(--tunic,var(--hotpink)); border:2.5px solid var(--ink); border-radius:10px 10px 4px 4px; }
  .chick{ --fur:#EFE28C; --fur-in:#FFF6C2; } .chick .ear{ display:none; }
  .fox{ --fur:#F0A560; --fur-in:#FFD2CE; } .fox .ear{ border-radius:70% 30% 0 30%; }
  .tunic-mint{ --tunic:var(--mint); } .tunic-peach{ --tunic:var(--peach); }
  .char.shake{ animation: shake .4s ease-in-out; }
  .char.win{ animation: hop .5s ease; }
  .char.lose{ animation: slump .5s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px) rotate(-6deg);} 75%{transform:translateX(6px) rotate(6deg);} }
  @keyframes hop{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  @keyframes slump{ 0%{transform:translateY(0) rotate(0);} 50%{transform:translateY(4px) rotate(-6deg);} 100%{transform:translateY(0) rotate(0);} }

  .playbox{ padding:22px 26px 30px; text-align:center; }
  .prompt{ font-family:'Fredoka', sans-serif; font-size:19px; margin:4px 0 18px; }
  .choices{ display:flex; justify-content:center; gap:16px; margin-bottom:10px; }
  .choice{
    width:76px; height:76px; border-radius:50%;
    background:var(--ivory); border:3px solid var(--ink);
    font-size:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:4px 4px 0 rgba(58,42,51,0.2); transition:transform .12s;
  }
  .choice:hover{ transform:translateY(-4px) scale(1.03); }
  .choice:active{ transform:translateY(0) scale(0.97); }
  .choice:disabled{ opacity:.5; cursor:default; transform:none; }

  .roundResult{ font-family:'Fredoka', sans-serif; font-size:17px; min-height:26px; margin-top:16px; color:var(--ink-soft); }
  .reveal{ display:flex; justify-content:center; gap:30px; margin-top:10px; font-size:34px; }
  .reveal .tag{ font-family:'Press Start 2P', monospace; font-size:8px; color:var(--ink-soft); margin-bottom:4px; }

  .btn{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--ink); background:var(--hotpink); border:2.5px solid var(--ink); border-radius:10px; padding:12px 20px; cursor:pointer; box-shadow:3px 3px 0 rgba(58,42,51,0.3); margin-top:16px; }
  .btn:hover{ transform:translateY(-2px); } .btn:active{ transform:translateY(0); }
  .hidden{ display:none !important; }
  .final{ text-align:center; padding:30px 20px; }
  .final h2{ font-family:'Fredoka', sans-serif; font-size:28px; margin:0 0 8px; }
  .final p{ color:var(--ink-soft); margin:0 0 18px; }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">◄ GARDEN</a>
    <div class="brand"><span class="brand-dot"></span> STALL 08</div>
    <div class="topright"></div>
  </div>

  <div class="hero">
    <span class="hero-tag">★ CHICK VS FOX ★</span>
    <h1>Rock Paper <span>Scissors</span></h1>
  </div>

  <div class="arena">

    <!-- Difficulty picker: now its own card, ABOVE the game stage -->
    <div class="diffCard" id="diffBox">
      <p>Pick a difficulty — this sets how clever Fox plays.</p>
      <div class="diffRow">
        <button class="diffBtn easy" data-diff="easy">EASY<small>Fox plays random</small></button>
        <button class="diffBtn medium" data-diff="medium">MEDIUM<small>Fox reads you a bit</small></button>
        <button class="diffBtn hard" data-diff="hard">HARD<small>Fox counters your habits</small></button>
      </div>
    </div>
    <div class="cur-diff" id="curDiff"></div>

    <div class="stage-card">
      <div class="awning"></div>
      <div class="stage">
        <div class="char chick" id="charYou"><div class="head"></div><div class="eye l"></div><div class="eye r"></div><div class="muzzle"></div><div class="blush l"></div><div class="blush r"></div><div class="body tunic-mint"></div></div>
        <div class="vs">VS</div>
        <div class="char fox" id="charCpu"><div class="ear l"></div><div class="ear r"></div><div class="head"></div><div class="eye l"></div><div class="eye r"></div><div class="muzzle"></div><div class="blush l"></div><div class="blush r"></div><div class="body tunic-peach"></div></div>
      </div>
      <div class="scoreboard">
        <div class="score-you">YOU: <span id="scoreYou">0</span></div>
        <div class="score-cpu">FOX: <span id="scoreCpu">0</span></div>
      </div>
      <div class="best-of" id="bestOf">FIRST TO 3 WINS</div>

      <div class="playbox hidden" id="playbox">
        <div class="prompt" id="prompt">Rock, paper, or scissors — no peeking!</div>
        <div class="choices">
          <button class="choice" data-c="rock">🪨</button>
          <button class="choice" data-c="paper">📄</button>
          <button class="choice" data-c="scissors">✂️</button>
        </div>
        <div class="reveal hidden" id="reveal">
          <div><div class="tag">YOU</div><div id="youIcon">❔</div></div>
          <div><div class="tag">FOX</div><div id="cpuIcon">❔</div></div>
        </div>
        <div class="roundResult" id="roundResult"></div>
      </div>

      <div class="final hidden" id="finalBox">
        <h2 id="finalTitle">You win!</h2>
        <p id="finalSub"></p>
        <button class="btn" id="restartBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

<script>
/* ---------- soft lofi ambient background music (inbuilt, no external file) ---------- */
(function () {
  const STORAGE_KEY = 'gg_sound';
  let audioCtx = null;
  let masterGain = null;
  let soundOn = (localStorage.getItem(STORAGE_KEY) !== 'off');
  let running = false;
  let chordTimer = null;
  let arpTimer = null;
  let chordIdx = 0;
  const listeners = [];

  const CHORDS = [
    [220.00, 261.63, 329.63, 392.00],
    [174.61, 220.00, 261.63, 349.23],
    [130.81, 164.81, 196.00, 246.94],
    [196.00, 246.94, 293.66, 349.23]
  ];
  const ARP_SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 987.77];
  let chordDurMs = 5400;

  function ctx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(audioCtx.destination);
    }
    return audioCtx;
  }

  function playPadNote(freq, startTime, durSec) {
    const c = ctx();
    const osc1 = c.createOscillator();
    const osc2 = c.createOscillator();
    osc1.type = 'sine';
    osc2.type = 'triangle';
    osc1.frequency.value = freq;
    osc2.frequency.value = freq * 1.004;
    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    const g = c.createGain();
    const attack = Math.min(1.6, durSec * 0.3);
    const release = Math.min(2.2, durSec * 0.35);
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(0.05, startTime + attack);
    g.gain.setValueAtTime(0.05, startTime + durSec - release);
    g.gain.linearRampToValueAtTime(0, startTime + durSec);
    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    osc1.start(startTime);
    osc2.start(startTime);
    osc1.stop(startTime + durSec + 0.1);
    osc2.stop(startTime + durSec + 0.1);
  }

  function scheduleChord() {
    if (!soundOn) return;
    const c = ctx();
    const chord = CHORDS[chordIdx % CHORDS.length];
    const now = c.currentTime;
    const durSec = (chordDurMs + 900) / 1000;
    chord.forEach(freq => playPadNote(freq, now, durSec));
    chordIdx++;
    chordTimer = setTimeout(scheduleChord, chordDurMs);
  }

  function playArpNote() {
    if (!soundOn) return;
    const c = ctx();
    const freq = ARP_SCALE[Math.floor(Math.random() * ARP_SCALE.length)];
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.03, t0 + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 2.0);
  }

  function scheduleArp() {
    if (!soundOn) return;
    if (Math.random() < 0.55) playArpNote();
    arpTimer = setTimeout(scheduleArp, 1500 + Math.random() * 2000);
  }

  function startMusic() {
    if (running || !soundOn) return;
    running = true;
    const c = ctx();
    if (c.state === 'suspended') c.resume();
    masterGain.gain.cancelScheduledValues(c.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
    masterGain.gain.linearRampToValueAtTime(1, c.currentTime + 1.5);
    scheduleChord();
    scheduleArp();
  }

  function stopMusic() {
    running = false;
    if (chordTimer) clearTimeout(chordTimer);
    if (arpTimer) clearTimeout(arpTimer);
    if (masterGain) {
      const c = ctx();
      masterGain.gain.cancelScheduledValues(c.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, c.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.7);
    }
  }

  function ensurePlaying() {
    if (!soundOn) return;
    const c = ctx();
    if (c.state === 'suspended') c.resume();
    if (!running) startMusic();
  }

  function setSoundOn(on) {
    soundOn = on;
    localStorage.setItem(STORAGE_KEY, soundOn ? 'on' : 'off');
    if (soundOn) ensurePlaying(); else stopMusic();
    listeners.forEach(cb => { try { cb(soundOn); } catch (e) {} });
    updateButton();
  }

  function setMood(level) {
    if (level === 'easy') chordDurMs = 6400;
    else if (level === 'hard') chordDurMs = 4200;
    else chordDurMs = 5400;
  }

  let btnEl = null;
  function updateButton() {
    if (btnEl) btnEl.textContent = soundOn ? '\uD83D\uDD0A' : '\uD83D\uDD07';
  }
  function injectButton() {
    btnEl = document.createElement('button');
    btnEl.id = 'ggSpeakerBtn';
    btnEl.type = 'button';
    btnEl.setAttribute('aria-label', 'Toggle background music');
    btnEl.style.cssText = [
      'position:fixed', 'top:18px', 'right:18px', 'z-index:9999',
      'width:44px', 'height:44px', 'border-radius:50%',
      'background:#FFFDF8', 'border:2.5px solid #3B2A22',
      'box-shadow:3px 3px 0 rgba(0,0,0,0.18)',
      'display:flex', 'align-items:center', 'justify-content:center',
      'font-size:18px', 'line-height:1', 'cursor:pointer', 'padding:0'
    ].join(';');
    updateButton();
    btnEl.addEventListener('click', function (e) {
      e.stopPropagation();
      setSoundOn(!soundOn);
    });
    document.body.appendChild(btnEl);
  }

  function init() {
    injectButton();
    ensurePlaying();
    document.addEventListener('click', ensurePlaying);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.GG = {
    isSoundOn: () => soundOn,
    setSoundOn,
    setMood,
    onToggle: (cb) => listeners.push(cb)
  };
})();
</script>
<script>
/* ---------- click / result sound effects ---------- */
let audioCtx = null;
function soundOn(){ return window.GG ? window.GG.isSoundOn() : true; }
function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function tone(freq, dur, type='sine', vol=0.18, delay=0){
  if(!soundOn()) return;
  const c = ctx(); const t0 = c.currentTime + delay;
  const osc = c.createOscillator(); const gain = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(c.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxTap(){ tone(500,0.08,'square',0.12); }
function sfxWhoosh(){ for(let i=0;i<3;i++) tone(300+i*80,0.08,'triangle',0.08,i*0.06); }
function sfxWin(){ tone(660,0.12,'triangle',0.15); tone(880,0.16,'triangle',0.15,0.1); }
function sfxLose(){ tone(300,0.2,'sawtooth',0.13); }
function sfxTie(){ tone(440,0.15,'sine',0.13); }
function sfxFanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.22,'triangle',0.16,i*0.12)); }
function sfxDown(){ [392,330,262].forEach((f,i)=>tone(f,0.28,'sine',0.14,i*0.15)); }

/* ---------- game logic ---------- */
const ICONS = { rock:'🪨', paper:'📄', scissors:'✂️' };
const COUNTER = { rock:'paper', paper:'scissors', scissors:'rock' };
const DIFFS = {
  easy:   { label:'EASY',   winTarget:3, adapt:0 },
  medium: { label:'MEDIUM', winTarget:3, adapt:0.35 },
  hard:   { label:'HARD',   winTarget:5, adapt:0.7 }
};
let currentDiff = DIFFS.medium;
let scoreYou = 0, scoreCpu = 0, locked = false;
let playerHistory = { rock:0, paper:0, scissors:0 };

function beats(a,b){
  return (a==='rock'&&b==='scissors') || (a==='paper'&&b==='rock') || (a==='scissors'&&b==='paper');
}

document.querySelectorAll('.diffBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    sfxTap();
    currentDiff = DIFFS[btn.dataset.diff];
    if(window.GG) window.GG.setMood(btn.dataset.diff);
    document.getElementById('curDiff').textContent = 'DIFFICULTY: ' + currentDiff.label;
    document.getElementById('bestOf').textContent = 'FIRST TO ' + currentDiff.winTarget + ' WINS';
    document.getElementById('diffBox').classList.add('hidden');
    document.getElementById('playbox').classList.remove('hidden');
    resetMatch();
  });
});

function resetMatch(){
  scoreYou = 0; scoreCpu = 0; locked = false;
  playerHistory = { rock:0, paper:0, scissors:0 };
  document.getElementById('scoreYou').textContent = '0';
  document.getElementById('scoreCpu').textContent = '0';
  document.getElementById('finalBox').classList.add('hidden');
  document.getElementById('playbox').classList.remove('hidden');
  document.getElementById('reveal').classList.add('hidden');
  document.getElementById('roundResult').textContent = '';
  document.getElementById('prompt').textContent = 'Rock, paper, or scissors — no peeking!';
  document.querySelectorAll('.choice').forEach(b => b.disabled = false);
}

function pickCpuMove(){
  const opts = ['rock','paper','scissors'];
  if(Math.random() < currentDiff.adapt){
    const favMove = Object.keys(playerHistory).reduce((a,b)=> playerHistory[a] >= playerHistory[b] ? a : b);
    if(playerHistory[favMove] > 0) return COUNTER[favMove];
  }
  return opts[Math.floor(Math.random()*3)];
}

document.querySelectorAll('.choice').forEach(btn=>{
  btn.addEventListener('click', ()=> playRound(btn.dataset.c));
});

function playRound(youPick){
  if(locked) return;
  locked = true;
  sfxTap();
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);

  playerHistory[youPick]++;
  const cpuPick = pickCpuMove();

  document.getElementById('youIcon').textContent = ICONS[youPick];
  document.getElementById('cpuIcon').textContent = ICONS[cpuPick];
  document.getElementById('reveal').classList.remove('hidden');
  sfxWhoosh();

  let resultMsg = '';
  if(youPick === cpuPick){
    resultMsg = "Tie! Both picked " + youPick + '.';
    sfxTie();
  } else if(beats(youPick, cpuPick)){
    scoreYou++;
    document.getElementById('scoreYou').textContent = scoreYou;
    document.getElementById('charYou').classList.add('win');
    document.getElementById('charCpu').classList.add('shake');
    setTimeout(()=>{ document.getElementById('charYou').classList.remove('win'); document.getElementById('charCpu').classList.remove('shake'); }, 500);
    resultMsg = youPick.charAt(0).toUpperCase() + youPick.slice(1) + ' beats ' + cpuPick + ' — you win the round!';
    sfxWin();
  } else {
    scoreCpu++;
    document.getElementById('scoreCpu').textContent = scoreCpu;
    document.getElementById('charCpu').classList.add('win');
    document.getElementById('charYou').classList.add('shake');
    setTimeout(()=>{ document.getElementById('charCpu').classList.remove('win'); document.getElementById('charYou').classList.remove('shake'); }, 500);
    resultMsg = cpuPick.charAt(0).toUpperCase() + cpuPick.slice(1) + ' beats ' + youPick + ' — Fox takes it!';
    sfxLose();
  }
  document.getElementById('roundResult').textContent = resultMsg;

  if(scoreYou >= currentDiff.winTarget || scoreCpu >= currentDiff.winTarget){
    setTimeout(endMatch, 1100);
  } else {
    setTimeout(()=>{
      locked = false;
      document.getElementById('reveal').classList.add('hidden');
      document.getElementById('roundResult').textContent = '';
      document.querySelectorAll('.choice').forEach(b => b.disabled = false);
    }, 1300);
  }
}

function endMatch(){
  document.getElementById('playbox').classList.add('hidden');
  document.getElementById('finalBox').classList.remove('hidden');
  const finalTitle = document.getElementById('finalTitle');
  const finalSub = document.getElementById('finalSub');
  if(scoreYou > scoreCpu){
    finalTitle.textContent = 'You win the match!';
    sfxFanfare();
  } else {
    finalTitle.textContent = 'Fox wins the match!';
    sfxDown();
  }
  finalSub.textContent = 'Final score — You: ' + scoreYou + '  ·  Fox: ' + scoreCpu;
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  sfxTap();
  document.getElementById('finalBox').classList.add('hidden');
  document.getElementById('playbox').classList.add('hidden');
  document.getElementById('diffBox').classList.remove('hidden');
});
</script>
</body>
</html>
